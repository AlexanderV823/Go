services:
  pg-master:
    image: postgres:16-alpine
    container_name: pg-master
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: master_admin_password
      POSTGRES_DB: mydb
    ports:
      - "5433:5432"
    volumes:
      - pg-master-data:/var/lib/postgresql/data
    entrypoint: [ "/bin/sh" ]
    command:
      - "-c"
      - |
        mkdir -p /docker-entrypoint-initdb.d
        echo 'echo "host replication postgres all trust" >> /var/lib/postgresql/data/pg_hba.conf' > /docker-entrypoint-initdb.d/01-init-replication.sh
        chmod +x /docker-entrypoint-initdb.d/01-init-replication.sh

        exec docker-entrypoint.sh postgres -c wal_level=replica -c max_wal_senders=10 -c wal_keep_size=1024MB
    networks:
      - pg-net

  pg-slave:
    image: postgres:16-alpine
    container_name: pg-slave
    environment:
      POSTGRES_PASSWORD: slave_admin_password
    ports:
      - "5434:5432"
    depends_on:
      - pg-master
    volumes:
      - pg-slave-data:/var/lib/postgresql/data
    entrypoint: [ "/bin/sh" ]
    command:
      - "-c"
      - |
        until pg_isready -h pg-master -U postgres; do
          echo 'Ожидание запуска Master...'
          sleep 2
        done

        if [ -z "$(ls -A /var/lib/postgresql/data)" ]; then
          echo 'Каталог пуст. Запуск клонирования pg_basebackup...'
          PGPASSWORD=master_admin_password pg_basebackup -h pg-master -D /var/lib/postgresql/data -U postgres -v -R -X stream
        fi

        echo 'Исправление прав и владельца файлов данных...'
        chmod 700 /var/lib/postgresql/data
        chown -R postgres:postgres /var/lib/postgresql/data

        echo 'Запуск Slave-сервера...'
        exec gosu postgres postgres
    networks:
      - pg-net

volumes:
  pg-master-data:
  pg-slave-data:

networks:
  pg-net:
    driver: bridge
